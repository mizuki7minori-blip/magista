<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="MAGISTA MTG カテゴリー別記事"><title>カテゴリー｜MAGISTA MTG</title><link rel="stylesheet" href="style.css"><style>
:root{--cat-text:#151515;--cat-muted:#555;--cat-bg:#f6f7f9;--cat-card:#fff;--cat-border:#d7dbe0}.category-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.category-nav a{padding:12px;background:#fff;color:#151515;border:2px solid #c8cdd3;border-radius:10px;text-decoration:none;font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.08)}.category-nav a:hover,.category-nav a:focus{border-color:#111;background:#f0f1f3;color:#000}.category-nav a.active{background:#111;color:#fff;border-color:#111}.category-rss-list{display:grid;gap:14px}.category-rss-card{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:16px;border:1px solid var(--cat-border);border-radius:14px;background:var(--cat-card);box-shadow:0 2px 8px rgba(0,0,0,.06);color:var(--cat-text)}.category-rss-thumb{width:110px;height:78px;object-fit:cover;border-radius:9px;background:#e9ebee}.category-rss-meta{font-size:12px;color:var(--cat-muted);font-weight:600}.category-rss-card h2{font-size:18px;line-height:1.45;margin:6px 0;color:var(--cat-text);font-weight:800}.category-rss-card p{line-height:1.7;margin:7px 0;color:#333;font-size:14px}.category-rss-card a{font-weight:800;color:#111;text-decoration:underline;text-underline-offset:3px}.category-rss-card a:hover{color:#444}.category-empty{color:#444;text-align:center;padding:40px}.category-status{color:#333;font-weight:700;margin-bottom:12px}.category-page-title{color:#111}.category-nav a,.category-rss-card h2,.category-rss-card p,.category-rss-card a,.category-rss-meta{overflow-wrap:anywhere}@media(max-width:700px){.category-nav{grid-template-columns:repeat(2,1fr)}.category-rss-card{grid-template-columns:82px 1fr;padding:13px}.category-rss-thumb{width:82px;height:64px}.category-rss-card h2{font-size:16px}.category-rss-card p{font-size:13px}}
</style></head>
<body>
<header class="site-header"><div class="container header-inner"><a class="logo" href="index.html"><strong>MAGISTA</strong><span>MTG</span></a><nav><a href="articles.html">記事一覧</a><a href="category.html?cat=news">ニュース</a><a href="category.html?cat=matome">5chまとめ</a><a href="category.html?cat=price">カード相場</a></nav><button class="menu-button">☰</button></div></header>
<main><section class="page-hero"><div class="container"><p class="section-kicker">CATEGORY</p><h1 id="category-title" class="category-page-title">カテゴリー</h1><p id="category-description">MAGISTAの記事をカテゴリー別にチェック。</p><div class="category-nav"><a href="category.html?cat=news" data-cat="news">📰 NEWS</a><a href="category.html?cat=tournament" data-cat="tournament">🏆 大会</a><a href="category.html?cat=card" data-cat="card">🃏 新カード</a><a href="category.html?cat=price" data-cat="price">💰 相場</a><a href="category.html?cat=deck" data-cat="deck">🧩 デッキ・環境</a><a href="category.html?cat=matome" data-cat="matome">💬 5ch・コミュニティ</a></div></div></section>
<section class="container page-grid"><div class="main-column"><div id="category-status" class="category-status">記事を読み込んでいます…</div><div id="category-rss-list" class="category-rss-list"></div></div><aside class="sidebar"><section class="side-card"><span class="section-kicker">CATEGORIES</span><h2>カテゴリー</h2><div class="category-links"><a href="category.html?cat=news">NEWS <span>→</span></a><a href="category.html?cat=tournament">大会 <span>→</span></a><a href="category.html?cat=matome">5ch・コミュニティ <span>→</span></a><a href="category.html?cat=card">新カード <span>→</span></a><a href="category.html?cat=price">カード相場 <span>→</span></a><a href="category.html?cat=deck">デッキ・環境 <span>→</span></a></div></section></aside></section></main>
<footer><div class="container footer-inner"><div><strong>MAGISTA</strong><span> MTG</span></div><small>© 2026 MAGISTA MTG</small></div></footer>
<script>
const RSS='https://api.rss2json.com/v1/api.json?rss_url=';const SOURCES=[['MTG公式','https://news.google.com/rss/search?q=site%3Amagic.wizards.com%2Fja%2Fnews+MTG&hl=ja&gl=JP&ceid=JP%3Aja'],['晴れる屋','https://news.google.com/rss/search?q=site%3Aarticle.hareruyamtg.com%2Farticle%2F+MTG&hl=ja&gl=JP&ceid=JP%3Aja'],['イゼ速。','https://www.izzetmtgnews.com/feed'],['4Gamer','https://www.4gamer.net/rss/news_topics.xml'],['5chまとめ','https://5chant.com/feed'],['BIGWEB','https://news.google.com/rss/search?q=site%3Amtg.bigweb.co.jp%2Farticles+MTG&hl=ja&gl=JP&ceid=JP%3Aja'],['MTGGoldfish','https://www.mtggoldfish.com/feed']];
const WORDS={tournament:['大会','優勝','top 8','top8','tournament','championship','finals','standings'],price:['価格','相場','買取','高騰','値上がり','値下がり','price','market','spike'],card:['新カード','新セット','スポイラー','プレビュー','spoiler','revealed','new card','expansion','secret lair'],matome:['5ch','5ちゃん','スレ','掲示板','reddit','thread','discussion'],deck:['デッキ','deck','standard','modern','commander','legacy','vintage']};
const names={news:['ニュース','MTGの最新ニュース・話題。'],tournament:['大会','大会結果・上位デッキ・競技シーン。'],matome:['5ch・コミュニティ','MTGコミュニティの話題。'],card:['新カード','新セット・新カード情報。'],price:['カード相場','カード価格・買取・価格推移。'],deck:['デッキ・環境','デッキ構築と環境の変化。']};const key=new URLSearchParams(location.search).get('cat')||'news';const info=names[key]||names.news;document.title=info[0]+'｜MAGISTA MTG';document.getElementById('category-title').textContent=info[0];document.getElementById('category-description').textContent=info[1];document.querySelectorAll('[data-cat]').forEach(a=>a.classList.toggle('active',a.dataset.cat===key));
function classify(x,src){const t=(`${x.title||''} ${x.description||''}`).toLowerCase();if(src==='5chまとめ')return'matome';for(const [k,w] of Object.entries(WORDS))if(w.some(v=>t.includes(v.toLowerCase())))return k;return'news'}function clean(v){return String(v||'').replace(/<[^>]*>/g,' ').replace(/&nbsp;/gi,' ').replace(/\s+/g,' ').trim()}
async function get(s){const r=await fetch(RSS+encodeURIComponent(s[1]));if(!r.ok)throw Error(r.status);const d=await r.json();return(d.items||[]).filter(x=>x.title&&x.link).map(x=>({...x,sourceName:s[0],categoryKey:classify(x,s[0]),image:x.thumbnail||x.enclosure?.link||x.enclosure?.url||''}))}
Promise.allSettled(SOURCES.map(get)).then(rs=>{const all=rs.flatMap(r=>r.status==='fulfilled'?r.value:[]);const unique=[...new Map(all.map(x=>[x.guid||x.link,x])).values()].filter(x=>x.categoryKey===key).sort((a,b)=>new Date(b.pubDate)-new Date(a.pubDate)).slice(0,30);const box=document.getElementById('category-rss-list');box.replaceChildren();if(!unique.length){document.getElementById('category-status').textContent='このカテゴリーの記事は現在ありません。';return}document.getElementById('category-status').textContent=`最新 ${unique.length} 件`;unique.forEach(x=>{const c=document.createElement('article');c.className='category-rss-card';const img=document.createElement('img');img.className='category-rss-thumb';img.src=x.image;img.alt='';img.loading='lazy';img.onerror=()=>img.style.visibility='hidden';c.append(img);const b=document.createElement('div');const m=document.createElement('div');m.className='category-rss-meta';m.textContent=`${x.sourceName} / ${x.pubDate?new Date(x.pubDate).toLocaleDateString('ja-JP'):''}`;const h=document.createElement('h2');h.textContent=x.title;const p=document.createElement('p');p.textContent=clean(x.description)||'記事の概要を確認できます。';const a=document.createElement('a');a.href=x.link;a.target='_blank';a.rel='noopener noreferrer';a.textContent='記事を読む →';b.append(m,h,p,a);c.append(b);box.append(c)})}).catch(()=>{document.getElementById('category-status').textContent='記事の取得に失敗しました。'})
</script></body></html>
