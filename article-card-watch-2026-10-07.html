<!doctype html><html lang="ja"><head><meta charset="UTF-8"><title>10月7日 今週の注目カード｜MAGSTA</title></head><body><main><article><h1>【10月7日】今週の注目カード｜Modern・イゼット果敢の新カードに注目</h1><p>『リアリティ・フラクチャー』発売直後の大型Modern大会で結果を残した《驕慢な&#25126;&#38360;魔道士》を、横浜の実戦結果から確認します。</p><h2>確認できた事実</h2><p>10月3～4日のチャンピオンズカップファイナルはModernで開催され、540名が参加。イゼット果敢は59名・10.9％で2番手勢力でした。</p><p>TOP8にはイゼット果敢が3名進出。井上徹選手は注目カード4枚、清水尚斗選手は2枚を採用し、黒川和彰選手は非採用型でした。</p><p>更新基準：2026年10月7日。</p></article></main></body></html>
