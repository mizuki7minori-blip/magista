name: Daily MAGSTA Pickup Update

on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pickup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update daily pickup cards
        run: python3 scripts/update_pickup.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pickup-data.json
          git diff --cached --quiet || git commit -m "chore: update daily pickup cards"
          git push
