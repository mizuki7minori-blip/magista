name: Sync article index

on:
  push:
    branches: [main]
    paths:
      - "article-*.html"
      - "scripts/sync_articles.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync article metadata and sitemap
        run: python scripts/sync_articles.py

      - name: Commit generated updates
        run: |
          if git diff --quiet -- article-data.js sitemap.xml; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add article-data.js sitemap.xml
          git commit -m "Auto-sync article metadata and sitemap"
          git push
