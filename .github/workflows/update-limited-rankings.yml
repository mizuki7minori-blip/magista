name: Update Limited Rankings

on:
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * *'
  push:
    paths:
      - '.github/workflows/update-limited-rankings.yml'
      - 'scripts/update_limited_rankings.py'
      - 'scripts/update_limited_archetypes.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update card rankings
        run: python scripts/update_limited_rankings.py

      - name: Update archetype rankings
        run: python scripts/update_limited_archetypes.py

      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- limited-ranking-data.json; then
            echo "No ranking changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add limited-ranking-data.json
          git commit -m "Update Limited ranking snapshots"
          git push
