name: Update article index

on:
  push:
    branches: [main]
    paths:
      - 'article-*.html'
      - 'scripts/generate-article-index.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: article-index-main
  cancel-in-progress: true

jobs:
  build-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate article index
        run: node scripts/generate-article-index.mjs
      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs
      - name: Commit updated index
        run: |
          if git diff --quiet -- article-index.json sitemap.xml; then
            echo "No index or sitemap changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add article-index.json sitemap.xml
          git commit -m "Auto-update article index"
          git push
