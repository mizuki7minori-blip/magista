name: Daily market price history
on:
  push:
    paths:
      - 'scripts/update_market_history.py'
      - '.github/workflows/market-history.yml'
      - 'domestic-prices.json'
  schedule:
    - cron: '43 21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-history
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test index and quote validation
        run: python3 -m unittest discover -s tests -p 'test_market_history.py'
      - name: Record observed prices
        run: python3 scripts/update_market_history.py --initialize
      - name: Commit daily record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-basket.json market-history.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: record daily market prices'
          git pull --rebase
          git push
