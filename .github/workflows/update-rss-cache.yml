name: Update MAGSTA RSS cache

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update RSS cache
        run: python3 scripts/update_rss_cache.py
      - name: Commit cache when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rss-cache.json
          git diff --cached --quiet || git commit -m 'chore: update RSS cache'
          git push
